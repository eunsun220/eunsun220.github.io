name: collect-data

# 매일 한국 시간 약 06:45에 자동 실행합니다. (GitHub 시간 UTC 21:45)
# 무료 서버라 몇 분~수십 분 늦게 시작될 수 있습니다.
# 손으로 Run workflow 버튼을 눌러서도 실행할 수 있습니다.
on:
  schedule:
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "true 로 하면 숫자는 모으지 않고 텔레그램 테스트 글만 보냅니다"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 파일 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 도구 설치
        run: pip install -r requirements.txt

      - name: 텔레그램 테스트 글만 보내기
        if: ${{ github.event.inputs.test_only == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py --test

      - name: 숫자 모으기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collect_data.py

      - name: 뉴스·공포탐욕·일정 모으기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python extras.py

      - name: 텔레그램으로 보내기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: 결과 파일 보관
        if: ${{ github.event.inputs.test_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data.json
            extras.json
