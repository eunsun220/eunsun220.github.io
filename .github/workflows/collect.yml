name: collect-data

# 매일 한국 시간 약 06:00에 자동 실행합니다. (GitHub 시간 UTC 21:00)
# 무료 서버라 몇십 분~2시간 정도 늦게 시작될 수 있습니다.
# 손으로 Run workflow 버튼을 눌러서도 실행할 수 있습니다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "true 로 하면 숫자는 모으지 않고 텔레그램 테스트 글만 보냅니다"
        required: false
        default: "false"
      force_sections:
        description: "시험용: 오늘이 아니어도 보고 싶은 코너를 쉼표로 적기 (weekly, ma, cover, monthend, monthly). 비워 두면 평소대로"
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 파일 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 도구 설치
        run: pip install -r requirements.txt

      - name: 텔레그램 테스트 글만 보내기
        if: ${{ github.event.inputs.test_only == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py --test

      - name: 숫자 모으기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collect_data.py

      - name: 뉴스·공포탐욕·일정 모으기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          FORCE_SECTIONS: ${{ github.event.inputs.force_sections }}
        run: python extras.py

      - name: 일요일 주간 특징주 모으기
        if: ${{ github.event.inputs.test_only != 'true' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_SECTIONS: ${{ github.event.inputs.force_sections }}
        run: python weekly.py

      - name: 수·토요일 이동평균선 점검
        if: ${{ github.event.inputs.test_only != 'true' }}
        continue-on-error: true
        env:
          HOLDINGS: ${{ secrets.HOLDINGS }}
          FORCE_SECTIONS: ${{ github.event.inputs.force_sections }}
        run: python ma_signals.py

      - name: 텔레그램으로 보내기
        if: ${{ github.event.inputs.test_only != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py
